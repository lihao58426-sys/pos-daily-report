# ── POS 日报推送 + Agent 问答 — 服务编排 ──
# pos-daily-report  每天 23:10~23:50 定时推日报（无端口）
# pos-agent-callback 企微回调（8003，已被 web 入口取代，保留参考）
# pos-agent-web      浏览器问答入口（8005，当前主入口，真实数据）
# pos-agent-demo     面试演示版问答入口（8006，独立 demo-data 假数据卷）
# 用法：docker compose up -d --build   /   docker compose logs -f pos-agent-web

services:
  pos-daily-report:
    build: .
    image: pos-report:latest
    container_name: pos-daily-report
    restart: unless-stopped
    command: ["python", "main.py", "--scheduler"]
    environment:
      - TZ=Asia/Shanghai
      - POS_ACCOUNT=${POS_ACCOUNT}
      - POS_PASSWORD=${POS_PASSWORD}
      - WEWORK_WEBHOOK_URL=${WEWORK_WEBHOOK_URL}
    volumes:
      - ./data:/app/data

  pos-agent-callback:
    build: .
    image: pos-report:latest
    container_name: pos-agent-callback
    restart: unless-stopped
    command: ["python", "callback_server.py"]
    ports:
      - "8003:8003"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - WEWORK_CORPID=${WEWORK_CORPID}
      - WEWORK_AGENTID=${WEWORK_AGENTID}
      - WEWORK_APPSECRET=${WEWORK_APPSECRET}
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ../rfm-report/data:/rfm_report/data

  pos-agent-web:
    build: .
    image: pos-report:latest
    container_name: pos-agent-web
    restart: unless-stopped
    command: ["python", "web_agent.py"]
    ports:
      - "8005:8005"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ../rfm-report/data:/rfm_report/data

  pos-agent-demo:
    image: pos-report:latest
    container_name: pos-agent-demo
    restart: unless-stopped
    command: ["python", "web_agent.py"]
    ports:
      - "8006:8006"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - TZ=Asia/Shanghai
      - PORT=8006
      - POS_DB_PATH=/app/data/demo.db
      - RFM_DB_PATH=/rfm_report/data/demo_rfm.db
    volumes:
      - ./demo-data:/app/data
      - ./demo-data:/rfm_report/data
